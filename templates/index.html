<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowPII</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef7ff', 100:'#d9ecff', 500:'#2563eb', 600:'#1d4ed8', 800:'#1e3a8a', 900:'#0f172a' },
            accent: { 500:'#0d9488' }
          },
          fontFamily: { sans: ['IBM Plex Sans', 'Noto Sans TC', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { background: radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 50%), radial-gradient(900px 500px at 100% 0%, #ccfbf1 0%, transparent 40%), #f8fafc; }
    .card { backdrop-filter: blur(8px); }
    textarea { field-sizing: content; min-height: 2.5rem; }
  </style>
</head>
<body class="font-sans text-slate-800 min-h-screen">
  <header class="border-b border-slate-200/80 bg-white/80 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <div class="h-9 w-9 rounded-xl bg-brand-600 text-white grid place-items-center font-bold shadow-sm">PII</div>
          <div>
            <h1 id="t-appTitle" class="text-lg font-semibold text-brand-900 leading-tight">FlowPII</h1>
            <p id="t-appSubtitle" class="text-xs text-slate-500"></p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span id="t-lang" class="text-slate-500">語言</span>
        <select id="lang" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 shadow-sm">
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 grid lg:grid-cols-12 gap-6">
    <section class="lg:col-span-4 space-y-4">
      <div class="card bg-white/90 border border-slate-200 rounded-2xl shadow-sm p-5">
        <h2 id="t-upload" class="font-semibold text-brand-800 mb-1">上傳</h2>
        <p id="t-uploadHint" class="text-sm text-slate-500 mb-4"></p>
        <label id="dropzone" class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-brand-100 hover:border-brand-500 rounded-xl bg-brand-50/50 px-4 py-10 cursor-pointer transition">
          <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/*" class="hidden" />
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
          <span id="t-dropHere" class="text-sm text-slate-600 text-center"></span>
          <span id="fileName" class="text-xs text-brand-600 font-medium"></span>
        </label>
        <div class="mt-4 flex flex-col gap-2">
          <button id="btnRecognize" class="w-full rounded-xl bg-brand-600 hover:bg-brand-800 text-white font-medium py-2.5 shadow disabled:opacity-50" disabled>
            <span id="t-recognize">開始辨識</span>
          </button>
          <button id="btnFixture" type="button" class="w-full rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm py-2">
            <span id="t-fixtureDemo">離線 DEMO</span>
          </button>
        </div>
        <div id="status" class="mt-3 text-sm text-slate-500"></div>
      </div>

      <div class="card bg-white/90 border border-slate-200 rounded-2xl shadow-sm p-5">
        <h2 id="t-meta" class="font-semibold text-brand-800 mb-3">盤點資訊</h2>
        <dl id="metaBox" class="text-sm space-y-2 text-slate-600">
          <p id="t-empty" class="text-slate-400"></p>
        </dl>
      </div>

      <div id="warnBox" class="hidden card bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm text-amber-900">
        <div id="t-warnings" class="font-semibold mb-1">警示</div>
        <ul id="warnList" class="list-disc pl-5 space-y-1"></ul>
      </div>
    </section>

    <section class="lg:col-span-8 space-y-4">
      <div class="card bg-white/90 border border-slate-200 rounded-2xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 id="t-preview" class="font-semibold text-brand-800">預覽</h2>
        </div>
        <div class="rounded-xl border border-slate-200 bg-slate-50 overflow-auto max-h-72">
          <img id="previewImg" alt="" class="hidden w-full object-contain" />
          <div id="previewEmpty" class="p-10 text-center text-slate-400 text-sm">—</div>
        </div>
      </div>

      <div class="card bg-white/90 border border-slate-200 rounded-2xl shadow-sm p-5">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h2 id="t-rows" class="font-semibold text-brand-800">傳輸列</h2>
          <div class="flex gap-2">
            <button id="btnAdd" class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50" disabled>
              <span id="t-addRow">新增</span>
            </button>
            <button id="btnConfirm" class="rounded-lg bg-accent-500 hover:bg-teal-700 text-white px-3 py-1.5 text-sm font-medium disabled:opacity-50" disabled>
              <span id="t-confirmExport">確認並匯出</span>
            </button>
            <button id="btnDownload" type="button" class="rounded-lg bg-brand-600 text-white px-3 py-1.5 text-sm font-medium disabled:opacity-40" disabled>
              <span id="t-download">下載</span>
            </button>
          </div>
        </div>
        <div class="overflow-auto rounded-xl border border-slate-200">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-100 text-slate-600 sticky top-0">
              <tr>
                <th class="px-2 py-2 text-left font-medium" id="th-A">A</th>
                <th class="px-2 py-2 text-left font-medium" id="th-B">B</th>
                <th class="px-2 py-2 text-left font-medium" id="th-G">G</th>
                <th class="px-2 py-2 text-left font-medium" id="th-H">H</th>
                <th class="px-2 py-2 text-left font-medium" id="th-AF">AF</th>
                <th class="px-2 py-2 text-left font-medium" id="th-AG">AG</th>
                <th class="px-2 py-2 text-left font-medium" id="th-AH">AH</th>
                <th class="px-2 py-2"></th>
              </tr>
            </thead>
            <tbody id="tbody" class="divide-y divide-slate-100 bg-white"></tbody>
          </table>
        </div>
        <p id="t-footer" class="mt-3 text-xs text-slate-500"></p>
        <p id="successMsg" class="hidden mt-2 text-sm text-teal-700 font-medium"></p>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
