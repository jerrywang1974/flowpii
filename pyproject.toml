[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpii"
version = "0.1.0"
description = "Recognize ISO 27701 BIF/DFD diagrams and export PII inventory Excel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pymupdf>=1.24",
  "pillow>=10",
  "pydantic>=2",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flowpii = "flowpii.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowpii = ["prompts/*.txt", "prompts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
